<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAI Muutosvahti</title>
  <meta name="description" content="RAI Muutosvahti kokoaa ikääntyneen asiakkaan esitiedot sosiaali- ja terveydenhuollon tiedoista RAI-arvioinnin osa-alueittain – roolin ja arviointitilanteen mukaan. AI ei päätä. AI huomaa. Ammattilainen arvioi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5566'/%3E%3Cpath d='M5 18h6l3-8 4 13 3-7h6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    /* Sama teema kuin sovelluksessa (raimv2:teema), ennen piirtoa ettei sivu välähdä */
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("raimv2:teema")); } catch (e) { /* ei tallennusta */ }
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="lp">
  <a class="lp-skip" href="#sisalto">Siirry sisältöön</a>

  <header class="lp-top">
    <div class="lp-wrap lp-top__inner">
      <a class="brand" href="index.html" aria-label="RAI Muutosvahti – etusivu">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M5 18h6l3-8 4 13 3-7h6"/></svg><span>RAI Muutosvahti</span>
      </a>
      <div class="lp-top__right">
        <button class="themebtn" type="button" id="lpTeema"></button>
      </div>
    </div>
  </header>

  <main id="sisalto" class="lp-main">
    <!-- Hero -->
    <section class="lp-hero">
      <div class="lp-wrap lp-hero__grid">
        <div class="lp-hero__text">
          <h1>Oikeat tiedot oikealle ammattilaiselle.</h1>
          <p class="lp-lead">Ikääntyneen asiakkaan esitiedot valmiina RAI-osa-alueittain – roolisi mukaan, muutokset lähteineen.</p>
          <div class="lp-cta">
            <a class="btn btn--primary lp-btn" href="login.html">Kirjaudu sisään <span aria-hidden="true">→</span></a>
          </div>
          <p class="lp-motto"><strong>AI ei päätä.</strong> AI huomaa. Ammattilainen arvioi.</p>
        </div>

        <!-- Esimerkkinäkymä: koriste, sama muotokieli kuin sovelluksessa -->
        <figure class="lp-preview" aria-label="Esimerkki asiakkaan esitietokoosteesta synteettisellä aineistolla">
          <div class="lp-card">
            <div class="lp-card__head">
              <span class="avatar avatar--punainen">22</span>
              <div class="lp-card__name"><strong>Asiakas 9422</strong><span>72 v · Kotihoito</span></div>
              <div class="ccount" aria-hidden="true">
                <span class="ccount__i ccount__i--punainen"><span class="status status--punainen"><svg class="status__icon" viewBox="0 0 16 16"><path d="M8 1.5 15 14.5H1z"/></svg></span>1</span>
                <span class="ccount__i ccount__i--keltainen"><span class="status status--keltainen"><svg class="status__icon" viewBox="0 0 16 16"><path d="M8 1 15 8 8 15 1 8z"/></svg></span>2</span>
              </div>
            </div>
            <div class="lp-bar" aria-hidden="true">
              <span class="lp-bar__fill"></span>
              <i class="lp-m lp-m--r" style="left:8%"></i>
              <i class="lp-m lp-m--y" style="left:21%"></i>
              <i class="lp-m lp-m--d" style="left:39%"></i>
              <i class="lp-m lp-m--r" style="left:56%"></i>
              <i class="lp-m lp-m--d" style="left:71%"></i>
              <i class="lp-m lp-m--g" style="left:86%"></i>
            </div>
            <div class="lp-bar__lbl" aria-hidden="true"><span><strong>Lähtötilanne</strong></span><span>Tänään</span></div>
            <ul class="lp-domains">
              <li class="lp-dom lp-dom--r"><span>Liikkuminen ja kaatumiset</span><em><span class="status status--punainen"><svg class="status__icon" viewBox="0 0 16 16"><path d="M8 1.5 15 14.5H1z"/></svg></span>Kielteinen muutos</em></li>
              <li class="lp-dom lp-dom--y"><span>Arjessa selviytyminen</span><em><span class="status status--keltainen"><svg class="status__icon" viewBox="0 0 16 16"><path d="M8 1 15 8 8 15 1 8z"/></svg></span>Seurattava</em></li>
              <li class="lp-dom lp-dom--n"><span>Mieliala ja uni</span><em><span class="status status--neutraali"><svg class="status__icon" viewBox="0 0 16 16"><rect x="2" y="4.5" width="12" height="2.6" rx="1.3"/><rect x="2" y="9" width="12" height="2.6" rx="1.3"/></svg></span>Ei muutoksia</em></li>
            </ul>
            <p class="lp-card__src"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Jokainen havainto lähteineen – ammattilainen arvioi</p>
          </div>
          <figcaption>Esimerkkinäkymä · synteettinen aineisto</figcaption>
        </figure>
      </div>
    </section>

  </main>

  <footer class="lp-foot">
    <div class="lp-wrap">Synteettinen aineisto · SOTE AI Hackathon 2026</div>
  </footer>

  <script>
    /* Teemavalitsin: vaalea ↔ tumma, sama tallennusavain kuin sovelluksessa */
    (function () {
      var IKONI = {
        light: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
        dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>'
      };
      var NIMI = { light: "Vaalea", dark: "Tumma" };
      var b = document.getElementById("lpTeema");
      function piirra() {
        var t = document.documentElement.getAttribute("data-theme");
        var seur = t === "dark" ? "light" : "dark";
        b.innerHTML = IKONI[t] + "<span>" + NIMI[t] + "</span>";
        b.setAttribute("aria-label", "Teema: " + NIMI[t] + ". Vaihda teemaksi " + NIMI[seur].toLowerCase() + ".");
      }
      b.addEventListener("click", function () {
        var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        try { localStorage.setItem("raimv2:teema", JSON.stringify(t)); } catch (e) { /* ei tallennusta */ }
        piirra();
      });
      piirra();
    })();
  </script>
</body>
</html>
